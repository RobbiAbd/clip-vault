<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Vault body -->
  <rect x="20" y="30" width="88" height="78" rx="8" fill="#2563eb" stroke="#1e40af" stroke-width="3"/>
  
  <!-- Vault door -->
  <rect x="32" y="42" width="64" height="54" rx="6" fill="#3b82f6"/>
  
  <!-- Combination dial -->
  <circle cx="64" cy="69" r="18" fill="#1e40af" stroke="#ffffff" stroke-width="2"/>
  <circle cx="64" cy="69" r="12" fill="#60a5fa"/>
  <circle cx="64" cy="69" r="4" fill="#ffffff"/>
  
  <!-- Clipboard icon on top -->
  <rect x="48" y="8" width="32" height="40" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="58" y="12" width="12" height="3" rx="1.5" fill="#2563eb"/>
  <line x1="54" y1="22" x2="74" y2="22" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="54" y1="28" x2="74" y2="28" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="54" y1="34" x2="68" y2="34" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Lock hint lines -->
  <line x1="64" y1="51" x2="64" y2="57" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
  <line x1="76" y1="69" x2="82" y2="69" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
  <line x1="64" y1="81" x2="64" y2="87" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
</svg>
